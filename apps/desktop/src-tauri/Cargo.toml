[package]
name = "kestrel-desktop"
description = "Kestrel file explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kestrel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Archives (`archive/`): zip, 7z and tar with its compressed forms are read and written in Rust.
# RAR is read through Windows' own tar.exe (libarchive), which no crate here replaces.
bzip2 = "0.6.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd", "util"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.0.3", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "ppmd", "xz"] }
kestrel-analyze = { workspace = true }
# Cleanup recommendations and the duplicate finder (cleanup/).
kestrel-cleanup = { workspace = true }
kestrel-db = { workspace = true }
kestrel-index = { workspace = true }
kestrel-query = { workspace = true }
memchr = { workspace = true }
# The command palette's fuzzy ranking (palette.rs).
nucleo-matcher = "0.3"
parking_lot = { workspace = true }
png = "0.18"
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `unstable` brings Tauri's multiwebview API: previewed content is shown in a webview of its
# own laid over the preview area (`previewview.rs`). `tray-icon`: the notification area icon
# (launcher.rs).
tauri = { version = "2", features = ["unstable", "tray-icon"] }
# The quick launcher's system-wide shortcut (launcher.rs).
tauri-plugin-global-shortcut = "2"
# COM interfaces (IFileOperation and friends) need the full bindings; plain functions use
# the lighter windows-sys. The progress sink is a COM object written in Rust: the `implement`
# macro (built into windows 0.62) expands to paths in `windows-core`, hence that dependency.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # IShellItemImageFactory::GetImage returns an HBITMAP (thumbnails).
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    # Dragging files out: shell data objects, item id lists and OLE drag and drop. GDI (above)
    # and structured storage are needed for STGMEDIUM, which the tests read the files back from.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell_Common",
    # Explorer parity (src/parity): reading shortcuts' targets (IShellLinkW::GetPath takes find
    # data) and the details pane's properties from the Windows property system.
    "Win32_Storage_FileSystem",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Mapped network drives and the shares of a server (thispc.rs, address.rs).
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    # Zip names stored without the UTF-8 flag are in the OEM code page, as Explorer reads them
    # (archive/reader.rs).
    "Win32_Globalization",
    # No "insert a disk" error box while an empty card reader or disc drive is asked about (thispc.rs).
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    # The size of NTFS's own file table, for the disk usage hub's totals (disk/volume.rs).
    "Win32_System_Ioctl",
    # A cleanup tool that runs too long is stopped with everything it started (cleanup/tool.rs).
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # The optional "start with Windows" entry under HKCU\...\Run (launcher.rs).
    "Win32_System_Registry",
    # One Kestrel per data folder: a named mutex and events (instance.rs).
    "Win32_System_Threading",
    # Zip archives keep local times; converting them (archive/time.rs).
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
