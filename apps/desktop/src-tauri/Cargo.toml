[package]
name = "kestrel-desktop"
description = "Kestrel file explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kestrel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kestrel-index = { workspace = true }
kestrel-query = { workspace = true }
parking_lot = { workspace = true }
png = "0.18"
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
# COM interfaces (IFileOperation and friends) need the full bindings; plain functions use
# the lighter windows-sys.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    # Dragging files out: shell data objects, item id lists and OLE drag and drop. GDI and
    # structured storage are needed for STGMEDIUM, which the tests read the files back from.
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell_Common",
] }
# Named by the code `#[implement]` generates for COM objects written in Rust.
windows-core = "0.62"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
