[package]
name = "kestrel-mcp"
description = "MCP server (stdio) that lets Claude Code and other MCP clients search and size files through a running Kestrel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kestrel-mcp"
path = "src/main.rs"

[dependencies]
kestrel-ipc = { workspace = true }
# The official Rust SDK of the Model Context Protocol: the stdio transport, JSON-RPC, and tools
# declared with their input schemas.
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
