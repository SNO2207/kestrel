[package]
name = "kestrel-ipc"
description = "Kestrel's local query service: the protocol, the named pipe server the app runs, and its client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true, features = [
    # NtQueryInformationFile's FilePipeLocalInformation: how much of an answer is still unread.
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
