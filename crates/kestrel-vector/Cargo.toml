[package]
name = "kestrel-vector"
description = "A flat, memory-mapped store of f16 vectors with a key per row, searched by brute force"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { workspace = true }
# f16 <-> f32; with `std` it converts slices with F16C when the processor has it.
half = { version = "2.4", features = ["std", "bytemuck"] }
memmap2 = "0.9"
rayon = { workspace = true }
