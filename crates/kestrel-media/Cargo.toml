[package]
name = "kestrel-media"
description = "The media library: a background pass over photos and videos for their facts, thumbnails and text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kestrel-db = { workspace = true }
kestrel-index = { workspace = true }
kestrel-query = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
# Windows does the reading: the property system for facts, WIC for images, Media Foundation for
# video frames and Windows.Media.Ocr for text, so nothing is downloaded or bundled.
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "System_UserProfile",
    "Win32_Foundation",
    # Text drawn into an image for the tests and fixtures (fixtures.rs).
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
windows-future = "0.3"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
